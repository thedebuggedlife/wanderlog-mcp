name: review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  static:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'sync/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      conflict: ${{ steps.conflict.outputs.conflict }}
      analysis_id: ${{ steps.upload-analysis.outputs.artifact-id }}
      analysis_digest: ${{ steps.upload-analysis.outputs.artifact-digest }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout base (fork main, trusted tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout PR head (untrusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Diff
        working-directory: head
        run: |
          mkdir -p "$(git rev-parse --git-path info)"
          echo '* diff' >"$(git rev-parse --git-path info/attributes)"
          git -c core.quotepath=false diff --no-ext-diff --no-renames --text --src-prefix=a/ --dst-prefix=b/ --numstat -z "$BASE_SHA"...HEAD -- . ':(exclude).github' >../numstat.txt
          git -c core.quotepath=false diff --no-ext-diff --no-renames --text --src-prefix=a/ --dst-prefix=b/ "$BASE_SHA"...HEAD -- . ':(exclude).github' >../diff.patch
          git -c core.quotepath=false diff --no-ext-diff --no-renames --text --src-prefix=a/ --dst-prefix=b/ --name-only "$BASE_SHA"...HEAD >../changed.txt
          git grep -lE '^(<<<<<<<|>>>>>>>) ' -- . ':(exclude).github' >../conflicts.txt || true
      - name: Merge-tree conflicts (marker-less, e.g. modify/delete)
        run: bash base/.github/fork/merge-conflicts.sh head conflicts.txt

      - id: conflict
        run: |
          if [ -s conflicts.txt ]; then echo conflict=true; else echo conflict=false; fi >>"$GITHUB_OUTPUT"

      - name: Install dependencies from scratch dirs (no tree npm config, no git)
        run: |
          for side in base head; do
            mkdir -p "npm-$side"
            cp "$side/package.json" "$side/package-lock.json" "npm-$side/" || echo "missing package files for $side"
            (cd "npm-$side" && npm ci --ignore-scripts --no-audit --no-fund --git=/bin/false) || echo "npm ci failed for $side"
          done

      - name: Dependency trees and audits
        run: |
          (cd npm-base && npm ls --omit=dev --all --json >../base-ls.json 2>/dev/null || true)
          (cd npm-head && npm ls --omit=dev --all --json >../head-ls.json 2>/dev/null || true)
          if (cd npm-head && npm audit signatures >../sig.txt 2>&1); then echo ok >sig-status; else echo fail >sig-status; fi
          (cd npm-head && npm audit --omit=dev --json >../audit.json 2>/dev/null || true)

      - name: Evidence
        run: >-
          node base/.github/fork/bin/evidence.ts --base base --head head --diff diff.patch
          --changed changed.txt --base-ls base-ls.json --head-ls head-ls.json --head-lock head/package-lock.json
          --audit audit.json
          --sig-status sig-status --sig-log sig.txt --no-tools --out evidence.json

      - id: upload-analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis
          path: |
            numstat.txt
            conflicts.txt
            diff.patch
            changed.txt
            evidence.json

  exec:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'sync/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      build_ok: ${{ steps.build.outcome == 'success' }}
      tests_ok: ${{ steps.test.outcome == 'success' }}
    steps:
      - name: Checkout base (fork main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout PR head (untrusted, executed here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install, typecheck, build (head)
        id: build
        continue-on-error: true
        working-directory: head
        run: npm ci --ignore-scripts && npm run typecheck && npm run build
      - name: Unit tests (head)
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: head
        run: npm test
      - name: Install and build (base)
        continue-on-error: true
        working-directory: base
        run: npm ci --ignore-scripts && npm run build
      - name: List tools (base and head)
        continue-on-error: true
        run: node base/.github/fork/bin/tools-list.ts --base base --head head --out tools.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exec
          path: tools.json
          if-no-files-found: ignore

  claude-review:
    needs: [static, exec]
    if: ${{ !cancelled() && needs.static.result == 'success' && needs.static.outputs.conflict != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.claude.outputs.structured_output }}
      model: ${{ steps.model.outputs.model }}
    steps:
      - name: Checkout base at the workspace root (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Checkout PR head into pr-head/ (untrusted, read as text)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
      - name: Remove agent instruction and config files from pr-head/ (any depth)
        run: |
          find pr-head \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .mcp.json -o -name .claude \) -prune -exec rm -rf {} +
          test -z "$(find pr-head \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .mcp.json -o -name .claude \) -print -quit)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.static.outputs.analysis_id }}
          digest-mismatch: error
          path: analysis
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: exec
          path: exec
      - id: inputs
        run: |
          {
            echo 'schema<<SCHEMA_EOF'
            jq -c . .github/fork/review-schema.json
            echo 'SCHEMA_EOF'
            echo 'prompt<<PROMPT_EOF'
            cat .github/fork/review-prompt.md
            echo 'PROMPT_EOF'
          } >>"$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: '*'
          prompt: ${{ steps.inputs.outputs.prompt }}
          claude_args: >-
            --model opus --effort high
            --add-dir pr-head
            --allowedTools "Read(./**),Grep,Glob"
            --disallowedTools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//tmp/**),Read(//etc/**),Read(//var/**),Read(//home/runner/.*/**),Read(//home/runner/work/_temp/**),Read(//home/runner/work/_actions/**),Read(//home/runner/runners/**)"
            --json-schema '${{ steps.inputs.outputs.schema }}'
      - id: model
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          model=$(jq -r '[.[] | select(.type == "system" and .subtype == "init") | .model][0] // "unknown"' "$EXEC" 2>/dev/null || echo unknown)
          echo "model=$model" >>"$GITHUB_OUTPUT"

  verdict:
    needs: [static, exec, claude-review]
    if: ${{ !cancelled() && needs.static.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout base tooling (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/fork
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: ${{ needs.static.outputs.analysis_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.static.outputs.analysis_id }}
          digest-mismatch: error
          path: analysis
      - name: Gates
        env:
          BUILD_OK: ${{ needs.exec.outputs.build_ok == 'true' }}
          TESTS_OK: ${{ needs.exec.outputs.tests_ok == 'true' }}
        run: |
          if [ -f analysis/evidence.json ]; then
            node trusted/.github/fork/bin/gates.ts --numstat analysis/numstat.txt --conflicts analysis/conflicts.txt \
              --build-ok "$BUILD_OK" --tests-ok "$TESTS_OK" --out gates.json
          fi
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      - id: labels
        name: Read the sticky needs-human label
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          sticky=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | index("needs-human") != null')
          echo "sticky=$sticky" >>"$GITHUB_OUTPUT"
      - name: Decide
        env:
          REVIEW: ${{ needs.claude-review.outputs.review }}
          MODEL: ${{ needs.claude-review.outputs.model }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          STICKY: ${{ steps.labels.outputs.sticky }}
        run: >-
          node trusted/.github/fork/bin/decide.ts --gates gates.json --evidence analysis/evidence.json
          --review-env REVIEW --model "$MODEL" --head-ref "$HEAD_REF" --sticky-needs-human "$STICKY"
          --out decision.json --comment comment.md
      - name: Apply
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: ${{ vars.FORK_REVIEWER }}
        run: bash trusted/.github/fork/apply-verdict.sh decision.json comment.md
      - name: Fail closed when the verdict job fails
        if: failure() && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --silent "repos/$REPO/statuses/$SHA" -f state=failure -f context=fork/verdict \
            -f description="Verdict job failed" || true
          gh pr edit "$PR" --repo "$REPO" --add-label needs-human || true

  human-exec:
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'sync/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout PR head (executed here, no secrets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Fork tooling tests
        working-directory: .github/fork
        run: npm ci --ignore-scripts && npm test

  human-verdict:
    needs: [human-exec]
    if: ${{ !cancelled() && needs.human-exec.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      - name: Post fork statuses
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EXEC: ${{ needs.human-exec.result }}
        run: |
          status() {
            gh api --silent "repos/$REPO/statuses/$SHA" -f state="$1" -f context="$2" -f description="$3"
          }
          if [ "$EXEC" = success ]; then
            status success fork/gates "Format, lint, typecheck, build and tests passed"
          else
            status failure fork/gates "Format, lint, typecheck, build or tests failed"
          fi
          status success fork/verdict "Human-authored PR: no automated review"
