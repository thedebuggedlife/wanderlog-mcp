name: tooling
on:
  pull_request:
    paths: ['.github/fork/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/fork/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: .github/fork
      - run: npm test
        working-directory: .github/fork
